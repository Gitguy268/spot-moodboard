name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: dropdown
    id: look
    attributes:
      label: Look
      options: [Pinboard, Gallery, Cozy, All of them]
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Browser, version and device
      placeholder: Safari 26 on an iPhone 16 / Chrome 142 on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
